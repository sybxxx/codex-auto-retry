der-radius:50%;width:16px;height:16px;transition:transform .12s;display:block;box-shadow:0 1px 2px #0003}.switch input:checked+.switch-track{background:var(--panel-positive)}.switch input:checked+.switch-track .switch-thumb{transform:translate(16px)}.switch input:disabled+.switch-track{cursor:default;opacity:.45}.prompt-label-row{justify-content:space-between;gap:12px;margin-bottom:7px}.prompt-label-row>span{color:var(--panel-muted);font-variant-numeric:tabular-nums;font-size:11px}textarea{resize:vertical;width:100%;min-height:76px;color:var(--color-text-primary,#171918);background:var(--color-background-primary,#fff);border:1px solid var(--panel-border);border-radius:6px;padding:9px 10px;font-size:13px;line-height:1.5;display:block}textarea:disabled{color:var(--panel-muted);background:var(--panel-subtle)}.prompt-actions{justify-content:space-between;gap:12px;min-height:34px;margin-top:7px}.field-error{min-width:0;color:var(--panel-danger);font-size:11px;line-height:1.35}.command-button{color:#fff;cursor:pointer;background:#202522;border:1px solid #202522;border-radius:6px;flex:none;justify-content:center;align-items:center;gap:7px;min-height:32px;padding:6px 11px;font-size:12px;font-weight:620;display:inline-flex}@media (max-width:560px){.app-shell{padding:14px}.version{display:none}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric-next{grid-column:1/-1;min-height:62px}.queue-item{grid-template-columns:minmax(0,1fr) auto;gap:10px}.queue-state{min-width:68px}.queue-actions{grid-column:1/-1;justify-content:flex-end;margin-top:-4px}.settings-grid{grid-template-columns:1fr;gap:12px}.numeric-settings{grid-template-columns:minmax(0,1fr) minmax(86px,120px)}.delay-strategy{grid-column:1/-1;grid-template-columns:minmax(0,1fr) minmax(132px,1fr)}.delay-preview{grid-column:1/-1}.settings-footer{flex-direction:column;align-items:flex-start}}@media (prefers-reduced-motion:reduce){*,:before,:after{scroll-behavior:auto!important;transition-duration:.01ms!important;ani   <body>
    <main class="app-shell" id="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">
            <i data-lucide="refresh-cw"></i>
          </div>
          <div class="brand-copy">
            <h1>Codex Auto Retry</h1>
            <p class="service-line" id="service-line">正在连接</p>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="version" id="version"></span>
          <button class="icon-button" id="refresh-button" type="button" title="刷新状态" aria-label="刷新状态">
            <i data-lucide="refresh-cw"></i>
          </button>
        </div>
      </header>

      <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>

      <section class="metrics" aria-label="自动重试概况">
        <div class="metric">
          <span class="metric-label">服务</span>
          <strong class="metric-value status-value" id="service-status">
            <span class="status-dot status-dot-neutral"></span>
            连接中
          </strong>
        </div>
        <div class="metric">
          <span class="metric-label">队列</span>
          <strong class="metric-value" id="queue-count">--</strong>
        </div>
        <div class="metric metric-next">
          <span class="metric-label">下次重试</span>
          <strong class="metric-value countdown" id="next-retry">--</strong>
        </div>
      </section>

      <section class="queue-section" aria-labelledby="queue-heading">
        <div class="section-heading">
          <div>
            <h2 id="queue-heading">重试队列</h2>
            <p id="queue-summary">正在读取</p>
          </div>
          <span class="scan-time" id="scan-time"></span>
        </div>
        <div class="queue-list" id="queue-list" aria-live="polite">
          <div class="empty-state loading-state">
            <i data-lucide="clock"></i>
            <span>正在读取队列</span>
          </div>
        </div>
      </section>

      <section class="controls-section" aria-labelledby="settings-heading">
        <div class="section-heading compact-heading">
          <div>
            <h2 id="settings-heading">设置</h2>
          </div>
        </div>

        <div class="settings-grid">
          <div class="setting-row pause-row">
            <div class="setting-copy">
              <label for="pause-toggle">自动重试</label>
              <span id="pause-description">运行中</span>
            </div>
            <label class="switch" title="开启或暂停新的自动重试">
              <input id="pause-toggle" type="checkbox" role="switch" />
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            </label>
          </div>

          <div class="setting-row shared-server-row">
            <div class="setting-copy">
              <label for="shared-app-server-toggle">共享 Codex 后台</label>
              <span id="shared-app-server-description">默认关闭，不影响 Codex 官方后台</span>
            </div>
            <label class="switch" title="启用前会检查端口、握手、版本和进程归属">
              <input id="shared-app-server-toggle" type="checkbox" role="switch" />
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            </label>
          </div>

          <div class="prompt-setting">
            <div class="prompt-label-row">
              <label for="retry-prompt">后备重试文字</label>
              <span><span id="prompt-count">0</span>/500</span>
            </div>
            <textarea id="retry-prompt" maxlength="500" rows="3" spellcheck="false" disabled></textarea>
            <div class="prompt-actions">
              <span class="field-error" id="prompt-error" role="alert"></span>
              <button class="command-button" id="save-prompt" type="button" disabled>
                <i data-lucide="save"></i>
                <span>保存</span>
              </button>
            </div>
          </div>
          <div class="numeric-settings">
            <label for="max-recovery-attempts">本次故障恢复上限</label>
            <input id="max-recovery-attempts" type="number" min="1" max="1000" inputmode="numeric" />
            <label for="max-consecutive-retries">连续无进展重试上限</label>
            <input id="max-consecutive-retries" type="number" min="1" max="100" inputmode="numeric" />
            <div class="delay-strategy">
              <span id="delay-strategy-label">等待策略</span>
              <div class="segmented-control" role="group" aria-labelledby="delay-strategy-label">
                <label>
                  <input type="radio" name="delay-strategy" value="exponential" />
                  <span>翻倍递增</span>
                </label>
                <label>
                  <input type="radio" name="delay-strategy" value="linear" />
                  <span>等差递增</span>
                </label>
                <label>
                  <input type="radio" name="delay-strategy" value="fixed" />
                  <span>固定间隔</span>
                </label>
              </div>
            </div>
            <label for="initial-delay" id="initial-delay-label">首次等待（秒）</label>
            <input id="initial-delay" type="number" min="1" max="3600" inputmode="numeric" />
            <label for="max-delay">最大等待（秒）</label>
            <input id="max-delay" type="number" min="1" max="86400" inputmode="numeric" />
            <label for="delay-increment">每次增加（秒）</label>
            <input id="delay-increment" type="number" min="1" max="3600" inputmode="numeric" />
            <div class="delay-preview" id="delay-preview"></div>
            <span class="field-error settings-error" id="settings-error" role="alert"></span>
          </div>
          <div class="settings-footer">
            <label class="checkbox-setting">
              <input id="notifications-toggle" type="checkbox" />
              <span>达到重试上限时显示插件通知</span>
            </label>
            <button class="command-button" id="save-settings" type="button" disabled>
              <i data-lucide="save"></i>
              <span>保存全部设置</span>
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
